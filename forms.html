<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Rating form registration</title></head>
<body>
<!-- Netlify Forms detects this static form at build time; the course POSTs to it. -->
<form name="course-rating" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="course-rating">
  <input name="bot-field"><input name="name"><input name="stars"><input name="useful"><textarea name="text"></textarea><input name="credId"><input name="course">
</form>
</body></html>
